<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <title>Polymer Hub of India Logo</title>
  <!-- Background Card -->
  <rect width="100" height="100" fill="#0A1628" rx="16"/>
  
  <!-- Molecule Structure Above Book -->
  <circle cx="50" cy="27" r="4.5" fill="#FFFFFF"/>
  <circle cx="64" cy="19" r="3.5" fill="#38BDF8"/>
  <circle cx="64" cy="35" r="3.5" fill="#38BDF8"/>
  <circle cx="36" cy="19" r="3.5" fill="#F97316"/>
  <circle cx="36" cy="35" r="3.5" fill="#22C55E"/>
  
  <!-- Ring Bonds -->
  <line x1="50" y1="27" x2="64" y2="19" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="64" y1="19" x2="64" y2="35" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="64" y1="35" x2="50" y2="27" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="50" y1="27" x2="36" y2="35" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="36" y1="35" x2="36" y2="19" stroke="#94A3B8" stroke-width="1.8"/>
  <line x1="36" y1="19" x2="50" y2="27" stroke="#94A3B8" stroke-width="1.8"/>
  
  <!-- Top Indian Saffron Atom -->
  <circle cx="50" cy="9" r="4.5" fill="#F97316"/>
  <line x1="50" y1="13.5" x2="50" y2="22.5" stroke="#F97316" stroke-width="1.8"/>
  
  <!-- Outer Atoms -->
  <circle cx="74" cy="13" r="3.5" fill="#38BDF8"/>
  <line x1="64" y1="19" x2="74" y2="13" stroke="#94A3B8" stroke-width="1.8"/>
  <circle cx="74" cy="41" r="3.5" fill="#38BDF8"/>
  <line x1="64" y1="35" x2="74" y2="41" stroke="#94A3B8" stroke-width="1.8"/>
  <circle cx="26" cy="13" r="3.5" fill="#F97316"/>
  <line x1="36" y1="19" x2="26" y2="13" stroke="#F97316" stroke-width="1.8"/>
  <circle cx="26" cy="41" r="3.5" fill="#22C55E"/>
  <line x1="36" y1="35" x2="26" y2="41" stroke="#22C55E" stroke-width="1.8"/>
  
  <!-- Stem to Book -->
  <line x1="50" y1="35" x2="50" y2="52" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Open Book Base -->
  <path d="M12 58 Q40 48 50 54 L50 78 Q40 70 12 84 Z" fill="#1E293B"/>
  <path d="M88 58 Q60 48 50 54 L50 78 Q60 70 88 84 Z" fill="#1E293B"/>
  <path d="M50 54 L50 78" stroke="#F5C518" stroke-width="2"/>
  
  <!-- Left Page (Saffron) -->
  <path d="M14 60 Q40 50 48 56 L48 76 Q40 68 14 82 Z" fill="#EA580C"/>
  <!-- Right Page (Green) -->
  <path d="M86 60 Q60 50 52 56 L52 76 Q60 68 86 82 Z" fill="#16A34A"/>
  
  <!-- Book Border -->
  <path d="M12 58 Q40 48 50 54 L50 56 Q40 50 12 60 Z" fill="#0A1628"/>
  <path d="M88 58 Q60 48 50 54 L50 56 Q60 50 88 60 Z" fill="#0A1628"/>
  
  <!-- P & H Typography -->
  <text x="24" y="72" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">P</text>
  <text x="64" y="72" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">H</text>
</svg>
