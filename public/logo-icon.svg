<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 90" fill="none">
  <!-- Open Book Base -->
  <path d="M10 62 Q45 50 72 58 L72 78 Q45 70 10 82 Z" fill="#1B2D6B"/>
  <path d="M134 62 Q101 50 72 58 L72 78 Q101 70 134 82 Z" fill="#1B2D6B"/>
  <!-- Book spine -->
  <path d="M72 58 L72 78" stroke="#1B2D6B" stroke-width="2.5"/>
  <!-- Left page fill orange/saffron -->
  <path d="M12 64 Q45 53 70 60 L70 76 Q45 69 12 80 Z" fill="#F97316"/>
  <!-- Right page fill green -->
  <path d="M132 64 Q99 53 74 60 L74 76 Q99 69 132 80 Z" fill="#16A34A"/>
  <!-- Book dark overlay on top of fills -->
  <path d="M10 62 Q45 50 72 58 L72 60 Q45 52 10 64 Z" fill="#1B2D6B"/>
  <path d="M134 62 Q101 50 72 58 L72 60 Q101 52 134 64 Z" fill="#1B2D6B"/>

  <!-- P letter in book -->
  <text x="32" y="74" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="26" fill="#1B2D6B" letter-spacing="-1">P</text>
  <!-- H letter in book -->
  <text x="80" y="74" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="26" fill="#1B2D6B" letter-spacing="-1">H</text>

  <!-- Molecule structure above book -->
  <circle cx="72" cy="30" r="4.5" fill="#1B2D6B"/>
  <circle cx="88" cy="21" r="3.5" fill="#1B2D6B"/>
  <circle cx="88" cy="39" r="3.5" fill="#1B2D6B"/>
  <circle cx="56" cy="21" r="3.5" fill="#1B2D6B"/>
  <circle cx="56" cy="39" r="3.5" fill="#1B2D6B"/>
  <!-- Ring bonds -->
  <line x1="72" y1="25.5" x2="88" y2="21" stroke="#1B2D6B" stroke-width="2"/>
  <line x1="88" y1="21" x2="88" y2="39" stroke="#1B2D6B" stroke-width="2"/>
  <line x1="88" y1="39" x2="72" y2="34.5" stroke="#1B2D6B" stroke-width="2"/>
  <line x1="72" y1="34.5" x2="56" y2="39" stroke="#1B2D6B" stroke-width="2"/>
  <line x1="56" y1="39" x2="56" y2="21" stroke="#1B2D6B" stroke-width="2"/>
  <line x1="56" y1="21" x2="72" y2="25.5" stroke="#1B2D6B" stroke-width="2"/>
  <!-- Outer atoms -->
  <circle cx="72" cy="8" r="5" fill="#F97316"/>
  <line x1="72" y1="13" x2="72" y2="25.5" stroke="#1B2D6B" stroke-width="2"/>
  <circle cx="100" cy="14" r="4" fill="#1B2D6B"/>
  <line x1="88" y1="21" x2="100" y2="14" stroke="#1B2D6B" stroke-width="2"/>
  <circle cx="100" cy="46" r="4" fill="#1B2D6B"/>
  <line x1="88" y1="39" x2="100" y2="46" stroke="#1B2D6B" stroke-width="2"/>
  <circle cx="44" cy="14" r="4" fill="#F97316"/>
  <line x1="56" y1="21" x2="44" y2="14" stroke="#1B2D6B" stroke-width="2"/>
  <circle cx="44" cy="46" r="4" fill="#16A34A"/>
  <line x1="56" y1="39" x2="44" y2="46" stroke="#1B2D6B" stroke-width="2"/>
  <!-- Stem from molecule to book -->
  <line x1="72" y1="34.5" x2="72" y2="58" stroke="#1B2D6B" stroke-width="2" stroke-dasharray="2,2"/>
</svg>
