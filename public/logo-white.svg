<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" fill="none">
  <!-- ── ICON: Open Book + PH Monogram + Molecule (WHITE VERSION) ── -->
  <!-- Open Book Base -->
  <path d="M10 62 Q45 50 72 58 L72 78 Q45 70 10 82 Z" fill="rgba(255,255,255,0.9)"/>
  <path d="M134 62 Q101 50 72 58 L72 78 Q101 70 134 82 Z" fill="rgba(255,255,255,0.9)"/>
  <path d="M72 58 L72 78" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/>
  <!-- Left page saffron -->
  <path d="M12 64 Q45 53 70 60 L70 76 Q45 69 12 80 Z" fill="#F97316"/>
  <!-- Right page green -->
  <path d="M132 64 Q99 53 74 60 L74 76 Q99 69 132 80 Z" fill="#16A34A"/>
  <path d="M10 62 Q45 50 72 58 L72 60 Q45 52 10 64 Z" fill="rgba(255,255,255,0.9)"/>
  <path d="M134 62 Q101 50 72 58 L72 60 Q101 52 134 64 Z" fill="rgba(255,255,255,0.9)"/>
  <!-- PH letters white -->
  <text x="32" y="74" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="26" fill="white" letter-spacing="-1">P</text>
  <text x="80" y="74" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="26" fill="white" letter-spacing="-1">H</text>

  <!-- Molecule structure - white -->
  <circle cx="72" cy="30" r="4.5" fill="white"/>
  <circle cx="88" cy="21" r="3.5" fill="white"/>
  <circle cx="88" cy="39" r="3.5" fill="white"/>
  <circle cx="56" cy="21" r="3.5" fill="white"/>
  <circle cx="56" cy="39" r="3.5" fill="white"/>
  <line x1="72" y1="25.5" x2="88" y2="21" stroke="white" stroke-width="2"/>
  <line x1="88" y1="21" x2="88" y2="39" stroke="white" stroke-width="2"/>
  <line x1="88" y1="39" x2="72" y2="34.5" stroke="white" stroke-width="2"/>
  <line x1="72" y1="34.5" x2="56" y2="39" stroke="white" stroke-width="2"/>
  <line x1="56" y1="39" x2="56" y2="21" stroke="white" stroke-width="2"/>
  <line x1="56" y1="21" x2="72" y2="25.5" stroke="white" stroke-width="2"/>
  <!-- Outer atoms - keep brand colors for visibility -->
  <circle cx="72" cy="8" r="5" fill="#F97316"/>
  <line x1="72" y1="13" x2="72" y2="25.5" stroke="white" stroke-width="2"/>
  <circle cx="100" cy="14" r="4" fill="white"/>
  <line x1="88" y1="21" x2="100" y2="14" stroke="white" stroke-width="2"/>
  <circle cx="100" cy="46" r="4" fill="white"/>
  <line x1="88" y1="39" x2="100" y2="46" stroke="white" stroke-width="2"/>
  <circle cx="44" cy="14" r="4" fill="#F97316"/>
  <line x1="56" y1="21" x2="44" y2="14" stroke="white" stroke-width="2"/>
  <circle cx="44" cy="46" r="4" fill="#16A34A"/>
  <line x1="56" y1="39" x2="44" y2="46" stroke="white" stroke-width="2"/>
  <line x1="72" y1="34.5" x2="72" y2="58" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- Vertical divider - white -->
  <line x1="158" y1="12" x2="158" y2="78" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- ── TEXT: white ── -->
  <text x="174" y="42" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="white" letter-spacing="1">POLYMER HUB</text>
  <!-- OF INDIA -->
  <line x1="174" y1="50" x2="222" y2="50" stroke="#F97316" stroke-width="2"/>
  <text x="228" y="58" font-family="'Arial', Helvetica, sans-serif" font-weight="600" font-size="13" fill="rgba(255,255,255,0.8)" letter-spacing="3">OF INDIA</text>
  <line x1="296" y1="50" x2="344" y2="50" stroke="#16A34A" stroke-width="2"/>
  <!-- Tagline -->
  <text x="174" y="75" font-family="'Arial', Helvetica, sans-serif" font-weight="400" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="3.5">KNOWLEDGE  •  INNOVATION  •  FUTURE</text>
</svg>
